<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#f8f9fa; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .actor-box { fill: #fef08a; stroke: #a16207; stroke-width: 1.8; rx: 4; }
      .obj-box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.8; rx: 4; }
      .title { font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; font-family: 'Consolas', monospace; }
      .lifeline { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .active-bar { fill: #fef08a; stroke: #ca8a04; stroke-width: 1.2; }
      .msg-line { stroke: #1e293b; stroke-width: 1.5; fill: none; }
      .reply-line { stroke: #1e293b; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .msg-text { font-size: 11px; fill: #0f172a; font-family: 'Consolas', monospace; }
    </style>
    <marker id="solid-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="1,1 7,4 1,7" fill="#1e293b"/>
    </marker>
    <marker id="open-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polyline points="1,1 7,4 1,7" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- Banner -->
  <rect x="20" y="20" width="1060" height="45" fill="#1e293b" rx="6"/>
  <text x="550" y="48" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SEQUENCE DIAGRAM 4C: ENVIRONMENTAL RESTRICTION (DUST STORM)</text>

  <!-- Lifelines -->
  <!-- :ColonyOperator -->
  <rect x="40" y="85" width="140" height="40" class="actor-box"/>
  <text x="110" y="110" class="title">:ColonyOperator</text>
  <line x1="110" y1="125" x2="110" y2="620" class="lifeline"/>

  <!-- env:Environment -->
  <rect x="280" y="85" width="140" height="40" class="obj-box"/>
  <text x="350" y="110" class="title">env:Environment</text>
  <line x1="350" y1="125" x2="350" y2="620" class="lifeline"/>

  <!-- colony:Colony -->
  <rect x="520" y="85" width="130" height="40" class="obj-box"/>
  <text x="585" y="110" class="title">colony:Colony</text>
  <line x1="585" y1="125" x2="585" y2="620" class="lifeline"/>

  <!-- mission:ExplorationMission -->
  <rect x="760" y="85" width="200" height="40" class="obj-box"/>
  <text x="860" y="110" class="title">m:ExplorationMission</text>
  <line x1="860" y1="125" x2="860" y2="620" class="lifeline"/>

  <!-- 1. Weather change -->
  <line x1="110" y1="160" x2="350" y2="160" class="msg-line" marker-end="url(#solid-arrow)"/>
  <text x="120" y="152" class="msg-text">1: setCondition(DUST_STORM)</text>

  <!-- 2. submit exploration mission -->
  <line x1="110" y1="205" x2="585" y2="205" class="msg-line" marker-end="url(#solid-arrow)"/>
  <text x="120" y="197" class="msg-text">2: submitMission(m)</text>
  <rect x="580" y="205" width="10" height="240" class="active-bar"/>

  <!-- 3. delegate to submitMission() -->
  <line x1="590" y1="235" x2="860" y2="235" class="msg-line" marker-end="url(#solid-arrow)"/>
  <text x="600" y="227" class="msg-text">3: submitMission()</text>
  <rect x="855" y="235" width="10" height="170" class="active-bar"/>

  <!-- 4. Query Environment State -->
  <line x1="860" y1="270" x2="350" y2="270" class="msg-line" marker-end="url(#solid-arrow)"/>
  <text x="400" y="262" class="msg-text">4: Environment.getState()</text>
  <line x1="350" y1="295" x2="860" y2="295" class="reply-line" marker-end="url(#open-arrow)"/>
  <text x="400" y="290" class="msg-text">5: return DUST_STORM</text>

  <!-- 6. Dust Storm check failed -->
  <line x1="865" y1="330" x2="905" y2="330" class="msg-line"/>
  <line x1="905" y1="330" x2="905" y2="350" class="msg-line"/>
  <line x1="905" y1="350" x2="865" y2="350" class="msg-line" marker-end="url(#solid-arrow)"/>
  <text x="915" y="340" class="msg-text">6: failureReason = "Surface operations are not allowed during a dust storm."</text>
  <text x="915" y="355" class="msg-text">7: setStatus(FAILED)</text>

  <!-- 8. Return failure -->
  <line x1="855" y1="390" x2="590" y2="390" class="reply-line" marker-end="url(#open-arrow)"/>
  <text x="630" y="382" class="msg-text">8: return false</text>

  <!-- 9. Active mission stays null -->
  <line x1="590" y1="420" x2="630" y2="420" class="msg-line"/>
  <line x1="630" y1="420" x2="630" y2="435" class="msg-line"/>
  <line x1="630" y1="435" x2="590" y2="435" class="msg-line" marker-end="url(#solid-arrow)"/>
  <text x="640" y="430" class="msg-text">9: activeMission remains null (Never Active)</text>

  <!-- 10. Operator notified -->
  <line x1="580" y1="465" x2="110" y2="465" class="reply-line" marker-end="url(#open-arrow)"/>
  <text x="130" y="457" class="msg-text">10: return false ("Exploration Mission cannot start. Reason: Surface operations are not allowed...")</text>
</svg>